name: Release Pipeline

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  REPO_LOWER: ""

jobs:
  # --------------------------------------------------------------------------
  # Gate: Automated Multi-Platform Release & Container Publishing (GHCR)
  # --------------------------------------------------------------------------
  publish-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REPO_LOWER: ""
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Compute Lowercase Repository Identifier
        run: |
          echo "REPO_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@6a0805fcefea3d4657a47ac4c165951e33482018 # v4.2.2
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Package Backend Binary (.jar)
        working-directory: ./backend
        run: mvn clean package -B

      - name: Package Weather Agent Binary (.jar)
        working-directory: ./weather-agent
        run: mvn clean package -B

      - name: Package Calculator Agent Binary (.jar)
        working-directory: ./calculator-agent
        run: mvn clean package -B

      - name: Set up Node.js 20
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Build Frontend Distribution Bundle
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

      - name: Package Frontend Distribution Archive
        run: |
          tar -czf frontend-dist-${{ github.ref_name }}.tar.gz -C frontend/dist .

      - name: Prepare Release Artifacts Staging Directory
        run: |
          mkdir -p release-artifacts
          cp backend/target/*.jar release-artifacts/ || true
          cp weather-agent/target/*.jar release-artifacts/ || true
          cp calculator-agent/target/*.jar release-artifacts/ || true
          cp frontend-dist-${{ github.ref_name }}.tar.gz release-artifacts/
          cd release-artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.7.1

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend Container Image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/backend:${{ github.ref_name }}
            ghcr.io/${{ env.REPO_LOWER }}/backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and Push Weather Agent Container Image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: ./weather-agent
          file: ./weather-agent/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/weather-agent:${{ github.ref_name }}
            ghcr.io/${{ env.REPO_LOWER }}/weather-agent:latest
          cache-from: type=gha,scope=weather-agent
          cache-to: type=gha,mode=max,scope=weather-agent

      - name: Build and Push Calculator Agent Container Image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: ./calculator-agent
          file: ./calculator-agent/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/calculator-agent:${{ github.ref_name }}
            ghcr.io/${{ env.REPO_LOWER }}/calculator-agent:latest
          cache-from: type=gha,scope=calculator-agent
          cache-to: type=gha,mode=max,scope=calculator-agent

      - name: Create GitHub Release and Attach Binaries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} \
            release-artifacts/* \
            --title "A2A Hub Release ${{ github.ref_name }}" \
            --generate-notes
