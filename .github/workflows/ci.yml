name: CI Pipeline

on:
  push:
    branches: [main, 'release/*']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # --------------------------------------------------------------------------
  # Gate 1: Security Audit & Secret Detection (Fail-Fast Gate)
  # --------------------------------------------------------------------------
  security-audit:
    name: Security & Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Scan for Secret Leaks
        uses: gitleaks/gitleaks-action@f586c14365d4643c6aa59d472ae6e984bf47bb34 # v2.3.8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # --------------------------------------------------------------------------
  # Gate 2: Backend Registry Tests & Testcontainers (Java 21 · Spring Boot 3.4)
  # --------------------------------------------------------------------------
  backend-test:
    name: Backend Test (Java 21 · Testcontainers · JaCoCo)
    needs: [security-audit]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@6a0805fcefea3d4657a47ac4c165951e33482018 # v4.2.2
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # Pre-pull pgvector to prevent on-demand Testcontainers download timeouts & rate-limits
      - name: Pre-pull Testcontainers Vector Database Image
        run: docker pull pgvector/pgvector:pg16

      - name: Compile and Run Unit, Slice & Architecture Tests
        working-directory: ./backend
        run: |
          if [ -f mvnw ]; then chmod +x mvnw && ./mvnw clean test -B; else mvn clean test -B; fi

      - name: Upload JaCoCo Coverage Report
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        if: always()
        with:
          name: backend-jacoco-coverage
          path: backend/target/site/jacoco
          if-no-files-found: ignore

  # --------------------------------------------------------------------------
  # Gate 3: Agent Microservices Tests (weather-agent & calculator-agent)
  # --------------------------------------------------------------------------
  agents-test:
    name: Agent Test (${{ matrix.service }})
    needs: [security-audit]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        service: [weather-agent, calculator-agent]
    steps:
      - name: Checkout Source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@6a0805fcefea3d4657a47ac4c165951e33482018 # v4.2.2
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Test ${{ matrix.service }} Suite
        working-directory: ./${{ matrix.service }}
        run: mvn clean test -B

  # --------------------------------------------------------------------------
  # Gate 4: Frontend Unit Tests, Typecheck & Production Build (Vue 3 + Vite)
  # --------------------------------------------------------------------------
  frontend-test:
    name: Frontend Test & Build (Vue 3 · Vitest · TypeScript)
    needs: [security-audit]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js 20
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Frontend Dependencies Hermetically
        working-directory: ./frontend
        run: npm ci

      - name: Run Frontend Vitest Test Suite with Coverage
        working-directory: ./frontend
        run: npm run test:coverage

      - name: Upload Vitest Coverage Report
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        if: always()
        with:
          name: frontend-vitest-coverage
          path: frontend/coverage
          if-no-files-found: ignore

      - name: Typecheck and Build Bundle
        working-directory: ./frontend
        run: npm run build

  # --------------------------------------------------------------------------
  # Gate 5: Matrix Docker Build & Vulnerability Scan (Trivy for All Services)
  # --------------------------------------------------------------------------
  docker-scan:
    name: Container Scan (${{ matrix.service }})
    needs: [backend-test, agents-test, frontend-test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        service: [backend, weather-agent, calculator-agent, frontend]
    steps:
      - name: Checkout Source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.7.1

      - name: Build Service Container Image with Scoped GHA Cache
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          load: true
          tags: a2a-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Run Container Vulnerability Scan with Trivy
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: a2a-${{ matrix.service }}:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-${{ matrix.service }}.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          trivyignores: '.trivyignore'

      - name: Upload Security SARIF to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@87ef0dc97def48aa960fbf026a2563ee9dbdb470 # v3
        if: always()
        with:
          sarif_file: 'trivy-${{ matrix.service }}.sarif'
          category: 'trivy-${{ matrix.service }}'
