name: CI Pipeline

on:
  push:
    branches: [main, 'release/*']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  security-events: write

jobs:
  # --------------------------------------------------------------------------
  # Gate 1: Security Audit & Secret Detection
  # --------------------------------------------------------------------------
  security-audit:
    name: Security & Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Scan for Secret Leaks
        uses: gitleaks/gitleaks-action@f586c14365d4643c6aa59d472ae6e984bf47bb34 # v2.3.8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # --------------------------------------------------------------------------
  # Gate 2: Backend Unit, Slice & Testcontainers Integration Tests (Java 21)
  # --------------------------------------------------------------------------
  backend-test:
    name: Backend Test (Java 21 · Spring Boot 3.4)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@6a0805fcefea3d4657a47ac4c165951e33482018 # v4.2.2
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile and Run Unit, Slice & Architecture Tests
        working-directory: ./backend
        run: mvn clean test -B

      - name: Upload JaCoCo Coverage Report
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        if: always()
        with:
          name: backend-jacoco-coverage
          path: backend/target/site/jacoco
          if-no-files-found: ignore

  # --------------------------------------------------------------------------
  # Gate 3: Frontend Unit Tests, Typecheck & Production Build (Vue 3 + Vite)
  # --------------------------------------------------------------------------
  frontend-test:
    name: Frontend Test & Build (Vue 3 · Vitest · TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js 20
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Frontend Dependencies Hermetically
        working-directory: ./frontend
        run: npm ci

      - name: Run Frontend Vitest Test Suite with Coverage
        working-directory: ./frontend
        run: npm run test:coverage

      - name: Upload Vitest Coverage Report
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        if: always()
        with:
          name: frontend-vitest-coverage
          path: frontend/coverage
          if-no-files-found: ignore

      - name: Typecheck and Build Bundle
        working-directory: ./frontend
        run: npm run build

  # --------------------------------------------------------------------------
  # Gate 4: Container Build & Vulnerability Scan (Trivy)
  # --------------------------------------------------------------------------
  docker-scan:
    name: Docker Build & Vulnerability Scan
    needs: [backend-test, frontend-test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.7.1

      - name: Build Docker Image with GHA Caching
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: ./backend
          file: ./backend/Dockerfile
          load: true
          tags: a2a-hub-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Container Vulnerability Scan with Trivy
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: a2a-hub-backend:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          trivyignores: '.trivyignore'

      - name: Upload Security SARIF to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@87ef0dc97def48aa960fbf026a2563ee9dbdb470 # v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
