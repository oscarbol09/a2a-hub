services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: a2a-hub-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: a2ahub
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  weather-agent:
    build:
      context: ./weather-agent
      dockerfile: Dockerfile
    container_name: a2a-weather-agent
    ports:
      - "8081:8081"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8081/.well-known/agent-card.json"]
      interval: 15s
      timeout: 5s
      start_period: 25s
      retries: 3

  calculator-agent:
    build:
      context: ./calculator-agent
      dockerfile: Dockerfile
    container_name: a2a-calculator-agent
    ports:
      - "8082:8082"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8082/.well-known/agent-card.json"]
      interval: 15s
      timeout: 5s
      start_period: 25s
      retries: 3

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: a2a-hub-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/a2ahub
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      A2AHUB_SECURITY_SSRF_ALLOW_PRIVATE_NETWORKS: "true"
      A2A_HUB_BOOTSTRAP_AGENTS: "http://weather-agent:8081,http://calculator-agent:8082"
    depends_on:
      postgres:
        condition: service_healthy
      weather-agent:
        condition: service_healthy
      calculator-agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: a2a-hub-frontend
    ports:
      - "3000:8080"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  postgres_data:
