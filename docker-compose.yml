services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: a2a-hub-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: a2ahub
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: a2a-hub-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/a2ahub
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy

  weather-agent:
    build:
      context: ./weather-agent
      dockerfile: Dockerfile
    container_name: a2a-weather-agent
    ports:
      - "8081:8081"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      SPRING_AI_GOOGLE_GENAI_API_KEY: ${GEMINI_API_KEY}

  calculator-agent:
    build:
      context: ./calculator-agent
      dockerfile: Dockerfile
    container_name: a2a-calculator-agent
    ports:
      - "8082:8082"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}

volumes:
  postgres_data:
