server:
  port: 8080

spring:
  application:
    name: a2a-hub
    version: 0.0.1

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:a2ahub}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

a2ahub:
  security:
    api-key: ${A2A_HUB_API_KEY:}
    encryption-key: ${A2A_HUB_ENCRYPTION_KEY:}
    require-auth-for-reads: ${A2A_HUB_REQUIRE_AUTH_READS:false}
    ssrf:
      allow-private-networks: ${A2A_HUB_ALLOW_PRIVATE_NETWORKS:false}
  gemini:
    api-key: ${GEMINI_API_KEY:}
  health-monitor:
    interval-ms: ${A2A_HUB_HEALTH_INTERVAL_MS:60000}

springdoc:
  api-docs:
    enabled: ${A2A_HUB_ENABLE_API_DOCS:true}
  swagger-ui:
    enabled: ${A2A_HUB_ENABLE_SWAGGER_UI:true}

logging:
  level:
    root: INFO
    dev.a2ahub: DEBUG

