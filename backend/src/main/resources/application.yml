server:
  port: 8080

spring:
  application:
    name: a2a-hub
    version: 0.0.1

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:a2ahub}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: A2AHubHikariPool
      maximum-pool-size: 20
      minimum-idle: 20
      connection-timeout: 2500
      max-lifetime: 1800000
      idle-timeout: 600000
      leak-detection-threshold: 2000
      keepalive-time: 30000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 50
          order_inserts: true

  flyway:
    enabled: true
    baseline-on-migrate: true

a2ahub:
  security:
    api-key: ${A2A_HUB_API_KEY:}
    encryption-key: ${A2A_HUB_ENCRYPTION_KEY:}
    require-auth-for-reads: ${A2A_HUB_REQUIRE_AUTH_READS:false}
    ssrf:
      allow-private-networks: ${A2A_HUB_ALLOW_PRIVATE_NETWORKS:false}
  gemini:
    api-key: ${GEMINI_API_KEY:}
  health:
    interval-ms: ${A2A_HUB_HEALTH_INTERVAL_MS:30000}
    retention-hours: ${A2A_HUB_HEALTH_RETENTION_HOURS:48}
  bootstrap:
    agents: ${A2A_HUB_BOOTSTRAP_AGENTS:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: ${A2A_HUB_ENABLE_API_DOCS:true}
  swagger-ui:
    enabled: ${A2A_HUB_ENABLE_SWAGGER_UI:true}

logging:
  level:
    root: ${A2A_HUB_LOG_ROOT_LEVEL:INFO}
    dev.a2ahub: ${A2A_HUB_LOG_LEVEL:DEBUG}

